<!doctype html>
<html lang="it">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JWT</title>
	<link rel="icon" href="img/icoVallauri.png" type="image/png" />
	<link rel="stylesheet" href="fontawesome-free-5.11.2/css/all.css">
	<link rel="stylesheet" href="bootstrap-4.2.1/css/bootstrap.min.css">

	<script type="text/javascript" src="bootstrap-4.2.1/jquery/jquery.js"></script>
	<script type="text/javascript" src="bootstrap-4.2.1/js/bootstrap.min.js"></script>
	<script type="text/javascript" src="libreria.js"></script>
	<script type="text/javascript" src="login.js"></script>

	<style>
		.input-group-addon {
			width: 38px;
			height: 38px;
			text-align: center;
			line-height: 38px;
			background-color: #EEE;
			border-radius: 5px 0 0 5px;
			border: 1px solid #ccc;
			border-right: 0;
		}

		.titolo {
			font-size: 15pt;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<section class="vh-100 gradient-custom">
		<div class="container py-5 h-100">
			<div class="row d-flex justify-content-center align-items-center h-100">
				<div class="col-12 col-md-8 col-lg-6 col-xl-5">
					<div class="card bg-dark text-white" style="border-radius: 1rem;">
						<div class="card-body p-5 text-center">

							<div class="mb-md-5 mt-md-4 pb-5" id="loginForm">

								<p class="text-center">
									<img src="img/img.jpg" width="120" class="rounded-circle">
								</p>
								<h2 class="fw-bold mb-2 text-uppercase">Login</h2>
								<p class="text-white-50 mb-5">Inserisci i tuoi dati per fare l'accesso!</p>

								<div class="form-outline form-white mb-4">
									<div class="input-group form-group">
										<span class="input-group-addon">
											<i style="color: black;" class="fas fa-user"> </i>
										</span>
										<input class="form-control p-2" type="text" placeholder="Username"
											name="username" value="user">
									</div>
								</div>

								<div class="form-outline form-white mb-4">
									<div class="input-group form-group">
										<span class="input-group-addon">
											<i class="fas fa-lock" style="color: black"> </i>
										</span>
										<input class="form-control" type="password" placeholder="Password"
											name="password" value="pwd">
									</div>
								</div>

								<button class="btn btn-outline-light btn-lg px-5" id="btnLogin"
									type="submit">Login</button>


							</div>

							<div>
								<p class="mb-0">Non hai un account? <a href="#!"
										class="text-white-50 fw-bold">Registrati</a>
								</p>
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

</body>

</html>

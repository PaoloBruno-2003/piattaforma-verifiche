<!doctype html>
<html lang="it">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JWT</title>
	<link rel="icon" href="img/icoVallauri.png" type="image/png" />
	<link rel="stylesheet" href="fontawesome-free-5.11.2/css/all.css">
	<link rel="stylesheet" href="bootstrap-4.2.1/css/bootstrap.min.css">
	<link rel="stylesheet" href="index.css">

	<script type="text/javascript" src="bootstrap-4.2.1/jquery/jquery.js"></script>
	<script type="text/javascript" src="bootstrap-4.2.1/js/bootstrap.min.js"></script>
	<script type="text/javascript" src="libreria.js"></script>
	<script type="text/javascript" src="index.js"></script>

	<style>
		.input-group-addon {
			width: 38px;
			height: 38px;
			text-align: center;
			line-height: 38px;
			background-color: #EEE;
			border-radius: 5px 0 0 5px;
			border: 1px solid #ccc;
			border-right: 0;
		}

		.titolo {
			font-size: 15pt;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<div class="container-fluid" id="mainForm">
		<div class="alert alert-light text-center">
			<div class="row" style="width:100%">
				<div class="col-sm-3">
				</div>
				<div class="col-sm-6">
					<img src="img/vallauri.jpg" class="img-fluid">
				</div>
				<div class="col-sm-1">
					<button type="button" class="btn btn-secondary form-control" id="btnLogout"
						style="margin-top:38px; margin-left:22px;">Logout</button>
				</div>
				<div class="col-sm-2"></div>
			</div>
		</div>

		<hr />
		<div class="row" style="width:100%">
			<div class="col-lg-2"></div>
			<div style="background-color: red; color: white; border-radius: 10px; width: 30%"
				class="card m-2 col-12 col-lg-4">
				<div class="row no-gutters">
					<div class="col-4 col-lg-6 p-2 container-fluid">
						<img class="card-img img-fluid" style="object-fit: cover;" src="/img/notes.png"
							alt="Registro Elettronico">
					</div>
					<div class="col-lg-5 col-sm-6">
						<div class="card-body">
							<h5 class="card-title">Registro Elettronico</h5>
							<p class="card-text">Registro nel quale puoi visualizzare i tuoi voti e le tue medie per
								materia.</p>
							<a href="#" class="btn" id="btnRegistro"
								style="background-color: rgb(219, 60, 60); color: white;">VAI
								>>></a>
						</div>
					</div>
				</div>
			</div>
			<div style="background-color: green; color: white; border-radius: 10px; width: 30%"
				class="card m-2 col-12 col-lg-4">
				<div class="row no-gutters">
					<div class="col-4 col-lg-6 p-2 container-fluid">
						<img class="card-img img-fluid" style="object-fit: cover;" src="/img/test.png" alt="Verifiche">
					</div>
					<div class="col-lg-5 col-sm-6">
						<div class="card-body">
							<h5 class="card-title">Test</h5>
							<p class="card-text">Clicca per visualizzare i test ancora da eseguire!.</p>
							<a href="#" class="btn" id="showTest"
								style="background-color: rgb(122, 216, 78); color: white;">VAI >>></a>
						</div>
					</div>
				</div>
			</div>
		</div>
		<br>
		<div class="row" style="width:100%">
			<div class="col-lg-2"></div>
			<div style="background-color: rgb(201, 130, 0); color: white; border-radius: 10px; width: 30%"
				class="card m-2 col-12 col-lg-4">
				<div class="row no-gutters">
					<div class="col-4 col-lg-6 p-2 container-fluid">
						<img class="card-img img-fluid" style="object-fit: cover;" src="/img/corrections.png"
							alt="Correzioni">
					</div>
					<div class="col-lg-5 col-sm-6">
						<div class="card-body">
							<h5 class="card-title">Correzioni</h5>
							<p class="card-text">Visualizza le correzioni dei test svolti!.</p>
							<a href="#" class="btn" id="showCorrection"
								style="background-color: rgb(211, 179, 37); color: white;">VAI
								>>></a>
						</div>
					</div>
				</div>
			</div>
			<div style="background-color: purple; color: white; border-radius: 10px; width: 30%"
				class="card m-2 col-12 col-lg-4">
				<div class="row no-gutters">
					<div class="col-4 col-lg-6 p-2 container-fluid">
						<img class="card-img img-fluid" style="object-fit: cover;" src="/img/absent.png"
							alt="Verifiche">
					</div>
					<div class="col-lg-5 col-sm-6">
						<div class="card-body">
							<h5 class="card-title">Assenze</h5>
							<p class="card-text">Clicca per visualizzare le assenze.</p>
							<a href="#" class="btn" id="btnAssenze"
								style="background-color: rgb(200, 78, 216); color: white; box-sizing: border-box;">VAI
								>>></a>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="modal fade" id="ModalVerifiche" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
			aria-hidden="true">
			<div class="modal-dialog" role="document">
				<div class="modal-content bg-dark">
					<div class="modal-header">
						<h6 class="modal-title" id="ModalText" style="color: white;"></h6>
						<button type="button" class="close" data-dismiss="modal" aria-label="Close">
							<span class="color: white" aria-hidden="true">&times;</span>
						</button>
					</div>
					<div class="modal-body" id="ModalBody">
						<ul id="testList" style="color: white;">

						</ul>
					</div>
					<div class="modal-footer ">
						<button type="button" class="btn btn-danger" id="closeModal" data-dismiss="modal">Close</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
